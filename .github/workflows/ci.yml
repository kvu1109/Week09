name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven   # caching

      - name: Run Unit Tests
        run: mvn clean test --batch-mode

  # Job checkstyle cho PR (chỉ chạy trên ubuntu, không cần matrix)
  checkstyle-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkstyle Inline Review
        uses: dbelyaev/action-checkstyle@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          checkstyle_config: google_checks.xml
          filter_mode: diff_context

  checkstyle-gate:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - name: Set up JDK 25
          uses: actions/setup-java@v4
          with:
            java-version: '25'
            distribution: 'temurin'
            cache: 'maven'

        - name: Checkstyle gate (fails on violation)
          run: mvn checkstyle:check --batch-mode